<style>
    /* Progreso fijo en la parte superior */
    .progress-fixed {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: white;
        border-bottom: 1px solid var(--bs-border-color-translucent);
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        padding: 0.75rem 0;
        backdrop-filter: blur(10px);
    }

    .progress-fixed .progress {
        height: 12px;
        border-radius: 1rem;
        background-color: var(--bs-tertiary-bg);
        overflow: hidden;
    }

    .progress-fixed .progress-bar {
        transition: width 0.4s ease-in-out, background-color 0.3s ease;
        font-size: 0.7rem;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .progress-fixed {
            padding: 0.65rem 0;
        }

        .progress-fixed h5 {
            font-size: 1rem;
        }

        .progress-fixed .progress {
            height: 10px;
        }
    }

    @media (max-width: 576px) {
        .progress-fixed {
            padding: 0.5rem 0;
        }

        .progress-fixed h5 {
            font-size: 0.95rem;
        }

        .progress-fixed small {
            font-size: 0.72rem;
        }

        .progress-fixed .progress {
            height: 8px;
        }

        .progress-fixed .progress-bar {
            font-size: 0;
        }

        .progress-fixed .row {
            margin-bottom: 0.35rem !important;
        }
    }

    .countdown-timer {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.35rem 0.85rem;
        border-radius: 2rem;
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
        border: 1px solid rgba(var(--bs-primary-rgb), 0.15);
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .countdown-timer.warning {
        background: rgba(var(--bs-warning-rgb), 0.15);
        color: var(--bs-warning-text-emphasis, #997404);
        border-color: rgba(var(--bs-warning-rgb), 0.35);
    }

    .countdown-timer.danger {
        background: rgba(var(--bs-danger-rgb), 0.12);
        color: var(--bs-danger);
        border-color: rgba(var(--bs-danger-rgb), 0.35);
        animation: pulse-timer 1s ease-in-out infinite;
    }

    @keyframes pulse-timer {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }

    @media (max-width: 576px) {
        .countdown-timer {
            font-size: 0.85rem;
            padding: 0.3rem 0.65rem;
        }
    }

/* --- ESTILO ELEGANTE PARA TARJETA DE PREGUNTA --- */
    .pregunta-card {
        background: #ffffff;
        border: none;
        border-radius: 1.25rem;
        padding: 1.75rem 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); /* Sombra muy suave */
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .pregunta-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    /* Badge del número (Más limpio y circular) */
    .pregunta-badge {
        background: var(--bs-primary-bg-subtle) !important;
        color: var(--bs-primary) !important;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: 700;
        padding: 0 !important;
        flex-shrink: 0; /* Evita que el número se aplaste en mobile */
    }

    .pregunta-texto {
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1.5;
        color: #2b3440; /* Un tono oscuro más elegante que el negro puro */
        margin: 0;
    }

    /* --- GRID DE RESPUESTAS MODERNIZADO --- */
    .respuesta-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(110px, 1fr));
        gap: 0.85rem;
        margin-top: 1.5rem;
    }

    .respuesta-option {
        width: 100%;
        min-height: 90px;
        border: 2px solid var(--bs-border-color-translucent); /* Borde un poco más grueso pero sutil */
        border-radius: 1rem;
        background-color: transparent;
        color: var(--bs-body-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.25rem;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); /* Transición más fluida */
        padding: 0.75rem 0.5rem;
        text-align: center;
    }

    .respuesta-option:hover {
        border-color: rgba(var(--bs-primary-rgb), 0.4);
        background-color: rgba(var(--bs-primary-rgb), 0.02);
    }

    .respuesta-option .valor {
        font-size: 1.1rem;
        font-weight: 700;
        line-height: 1;
        color: var(--bs-secondary-color);
        transition: color 0.2s ease;
    }

    .respuesta-option .etiqueta {
        font-size: 0.85rem;
        line-height: 1.2;
        color: var(--bs-secondary-color);
    }

    /* Estado Seleccionado */
    .btn-check:checked + .respuesta-option {
        border-color: var(--bs-primary);
        background-color: var(--bs-primary-bg-subtle);
        box-shadow: 0 4px 15px rgba(var(--bs-primary-rgb), 0.15); /* Resplandor del color primario */
        transform: scale(1.03); /* Efecto pop al seleccionar */
    }

    .btn-check:checked + .respuesta-option .valor {
        color: var(--bs-primary);
    }

    .btn-check:checked + .respuesta-option .etiqueta {
        color: var(--bs-primary-text-emphasis);
        font-weight: 600;
    }

    /* --- OPTIMIZACIÓN EXTREMA PARA MÓVIL --- */
    @media (max-width: 992px) {
        .respuesta-grid {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }
    }

    @media (max-width: 576px) {
        .pregunta-card {
            /* Reducimos el padding horizontal para ganar espacio para el texto */
            padding: 1.25rem 0.85rem; 
            margin-bottom: 1.5rem !important;
            border-radius: 1rem;
        }

        .pregunta-badge {
            width: 34px;
            height: 34px;
            font-size: 0.95rem;
            margin-right: 0.75rem !important; /* Menos espacio entre número y texto */
        }

        .pregunta-texto {
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .respuesta-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 0.65rem;
        }

        .respuesta-option {
            min-height: 80px;
            padding: 0.6rem 0.4rem;
        }
    }

    /* --- OPCIONES PROGRESIVAS (texto completo por ítem) --- */
    .respuesta-lista-progresiva {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.5rem;
    }

    .respuesta-option-progresiva {
        width: 100%;
        border: 2px solid var(--bs-border-color-translucent);
        border-radius: 1rem;
        background-color: transparent;
        color: var(--bs-body-color);
        display: flex;
        align-items: flex-start;
        gap: 0.85rem;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 1rem 1.15rem;
        text-align: left;
        line-height: 1.45;
        font-size: 0.98rem;
    }

    .respuesta-option-progresiva:hover {
        border-color: rgba(var(--bs-primary-rgb), 0.4);
        background-color: rgba(var(--bs-primary-rgb), 0.02);
    }

    .respuesta-option-progresiva .opcion-indicador {
        flex-shrink: 0;
        width: 1.35rem;
        height: 1.35rem;
        border: 2px solid var(--bs-border-color);
        border-radius: 50%;
        margin-top: 0.15rem;
        position: relative;
        transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .btn-check:checked + .respuesta-option-progresiva {
        border-color: var(--bs-primary);
        background-color: var(--bs-primary-bg-subtle);
        box-shadow: 0 4px 15px rgba(var(--bs-primary-rgb), 0.12);
    }

    .btn-check:checked + .respuesta-option-progresiva .opcion-indicador {
        border-color: var(--bs-primary);
        background-color: var(--bs-primary);
        box-shadow: inset 0 0 0 3px #fff;
    }

    .btn-check:checked + .respuesta-option-progresiva .opcion-texto {
        color: var(--bs-primary-text-emphasis);
        font-weight: 500;
    }

    @media (max-width: 576px) {
        .respuesta-option-progresiva {
            padding: 0.85rem 0.9rem;
            font-size: 0.92rem;
        }
    }

    /* Botones de navegación fijos abajo */
    .navigation-fixed {
        position: sticky;
        bottom: 0;
        background: white;
        border-top: 1px solid var(--bs-border-color-translucent);
        box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
        padding: 0.75rem 0;
        margin-top: 3rem;
    }

    .btn-nav {
        min-width: 120px;
        font-weight: 600;
        border-radius: 0.65rem;
        padding: 0.7rem 1.35rem;
        transition: all 0.2s ease-in-out;
        border: 2px solid transparent;
        font-size: 0.95rem;
    }

    .btn-nav-back {
        background: var(--bs-light);
        color: var(--bs-body-color);
        border-color: var(--bs-border-color);
    }

    .btn-nav-back:hover {
        background: var(--bs-tertiary-bg);
        border-color: var(--bs-primary);
        color: var(--bs-primary);
        transform: translateX(-3px);
    }

    .btn-nav-next {
        background: var(--bs-primary);
        color: white;
        border-color: var(--bs-primary);
    }

    .btn-nav-next:hover {
        background: var(--bs-primary-hover, var(--bs-primary));
        border-color: var(--bs-primary-hover, var(--bs-primary));
        transform: translateX(3px);
        box-shadow: 0 4px 12px rgba(var(--bs-primary-rgb), 0.3);
    }

    .btn-nav-finalizar {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border-color: #059669;
    }

    .btn-nav-finalizar:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
    }

    .page-indicator {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: transparent;
        border-radius: 0;
        padding: 0;
        font-size: 0.85rem;
        color: var(--bs-secondary-color);
        font-weight: 500;
        white-space: nowrap;
        text-align: center;
        pointer-events: none;
    }

    @media (max-width: 768px) {
        .navigation-fixed {
            padding: 0.65rem 0;
        }

        .btn-nav {
            min-width: 90px;
            padding: 0.6rem 1rem;
            font-size: 0.88rem;
        }

        .page-indicator {
            font-size: 0.8rem;
        }
    }

    @media (max-width: 576px) {
        .navigation-fixed {
            padding: 0.5rem 0;
        }

        .btn-nav {
            padding: 0.55rem 0.85rem;
            font-size: 0.85rem;
            min-width: auto;
            flex: 1;
            border-radius: 0.5rem;
        }

        .btn-nav i {
            font-size: 0.85rem;
        }

        .page-indicator {
            position: absolute;
            top: -2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            background: white;
            padding: 0.25rem 0.65rem;
            border-radius: 1rem;
            border: 1px solid var(--bs-border-color-translucent);
        }

        .page-indicator i {
            font-size: 0.7rem;
        }

        .nav-controls {
            gap: 0.5rem !important;
        }
    }
</style>
